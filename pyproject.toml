[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnvet"
version = "0.1.0"
description = "Ground the claims in a vulnerability report against the actual codebase before you burn hours triaging it."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vulnvet contributors" }]
keywords = [
    "security",
    "triage",
    "vulnerability",
    "bug-bounty",
    "maintainers",
    "ai-slop",
    "fact-checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/umeramin99/Open-Source"
Issues = "https://github.com/umeramin99/Open-Source/issues"

[project.scripts]
vulnvet = "vulnvet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
