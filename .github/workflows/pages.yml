name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only one deploy at a time; let a newer commit finish rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the page is self-contained
        # The site must not depend on a CDN staying up, and must not leak
        # a visitor's request to a third party.
        run: |
          if grep -nE '(src|href)="https?://' docs/index.html \
             | grep -v 'github\.com'; then
            echo "docs/index.html loads an external resource" >&2
            exit 1
          fi
          echo "self-contained"

      - name: Is Pages turned on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        # A repository has Pages off until someone turns it on in
        # Settings, and the workflow token is not allowed to do that for
        # them ("Resource not accessible by integration"). Deploying is
        # optional setup rather than part of the build, so report it and
        # stop instead of leaving a red mark on main until someone
        # notices.
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages is not enabled::Settings -> Pages, set Source to \"GitHub Actions\". The next push touching docs/ will deploy, or re-run this workflow."
          fi

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.on == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.on == 'true'
        with:
          path: docs

      - id: deployment
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v5
