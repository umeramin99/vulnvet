version: 2

updates:
  # The workflows and the composite action pin nine third-party actions
  # between them. Nothing was updating those pins, and the README's
  # example snippet had already drifted from what the repository runs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # vulnvet has no runtime dependencies and intends to keep none, so
  # this only ever sees the build backend and the test tool.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
